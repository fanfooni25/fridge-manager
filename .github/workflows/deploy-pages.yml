name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'features.js'
      - 'cloud-sync.js'
      - 'index.html'
      - 'styles.css'
      - 'pwa.js'
      - 'sw.js'
      - 'nearby-config.js'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'capacitor.config.json'
      - 'android/**'
      - 'assets/**'
      - 'data/**'
      - 'icons/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Android APK
        run: pnpm run mobile:prepare && pnpm exec cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build website files
        run: node scripts/build-pages.mjs
      - name: Add APK to website downloads
        run: mkdir -p site/downloads && cp android/app/build/outputs/apk/debug/app-debug.apk site/downloads/fridge-manager.apk
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
